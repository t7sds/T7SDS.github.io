<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connect with T7SDS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }
    .title-font {
      font-family: 'Space Grotesk', sans-serif;
    }

    .hero-bg {
      background: radial-gradient(circle at center, #3b0764 0%, #0a0a0a 70%);
    }

    .contact-card {
      transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    
    .contact-card:hover {
      transform: translateY(-10px);
      background: rgba(255,255,255,0.08);
    }

    .icon-circle {
      transition: all 0.5s ease;
    }
    
    .contact-card:hover .icon-circle {
      transform: scale(1.1) rotate(12deg);
      box-shadow: 0 0 30px -5px currentColor;
    }

    .line {
      height: 1px;
      background: linear-gradient(to right, transparent, #a855f7, transparent);
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen hero-bg overflow-hidden">

  <!-- Background subtle grid -->
  <div class="fixed inset-0 bg-[linear-gradient(to_right,#27272a_1px,transparent_1px),linear-gradient(to_bottom,#27272a_1px,transparent_1px)] bg-[size:50px_50px] opacity-20 z-0"></div>

  <div class="relative z-10 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full">

      <!-- Profile Header -->
      <div class="text-center mb-16">
        <div class="mx-auto w-28 h-28 bg-gradient-to-br from-purple-600 via-pink-500 to-violet-600 rounded-3xl flex items-center justify-center text-6xl shadow-2xl mb-6 border-4 border-white/10">
          ℹ️
        </div>
        <h1 class="title-font text-5xl font-semibold tracking-tighter mb-2">T7SDS</h1>
        <p class="text-purple-300 tracking-widest text-sm font-medium">OPEN TO CONNECT</p>
        
        <div class="w-16 h-0.5 mx-auto mt-8 bg-gradient-to-r from-transparent via-purple-500 to-transparent"></div>
      </div>

      <!-- Contact Options -->
      <div class="space-y-4">

        <!-- Email -->
        <div onclick="copyToClipboard('it7sds@gmail.com')" 
             class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-purple-500 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
          <div class="icon-circle w-12 h-12 bg-purple-500/10 text-purple-400 flex items-center justify-center text-3xl rounded-2xl">
            ✉️
          </div>
          <div class="flex-1">
            <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-purple-400">Email</p>
            <p class="text-lg font-medium">it7sds@gmail.com</p>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-purple-400 text-xl"></i>
        </div>

        <!-- Telegram -->
        <a href="https://t.me/imt7s" target="_blank"
           class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-sky-400 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
          <div class="icon-circle w-12 h-12 bg-sky-500/10 text-sky-400 flex items-center justify-center text-3xl rounded-2xl">
            <i class="fa-brands fa-telegram"></i>
          </div>
          <div class="flex-1">
            <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-sky-400">Telegram</p>
            <p class="text-lg font-medium">@imt7s</p>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-sky-400 text-xl"></i>
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/t7sds" target="_blank"
           class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-pink-500 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
          <div class="icon-circle w-12 h-12 bg-pink-500/10 text-pink-400 flex items-center justify-center text-3xl rounded-2xl">
            <i class="fa-brands fa-instagram"></i>
          </div>
          <div class="flex-1">
            <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-pink-400">Instagram</p>
            <p class="text-lg font-medium">@t7sds</p>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-pink-400 text-xl"></i>
        </a>

        <!-- X -->
        <a href="https://x.com/MyT7vrf" target="_blank"
           class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-white rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
          <div class="icon-circle w-12 h-12 bg-white/10 text-white flex items-center justify-center text-3xl rounded-2xl">
            <i class="fa-brands fa-x-twitter"></i>
          </div>
          <div class="flex-1">
            <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-white">X (Twitter)</p>
            <p class="text-lg font-medium">@MyT7vrf</p>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-white text-xl"></i>
        </a>

        <!-- GitHub -->
        <a href="https://github.com/it7sds" target="_blank"
           class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-emerald-500 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
          <div class="icon-circle w-12 h-12 bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-3xl rounded-2xl">
            <i class="fa-brands fa-github"></i>
          </div>
          <div class="flex-1">
            <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-emerald-400">GitHub</p>
            <p class="text-lg font-medium">@it7sds</p>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-emerald-400 text-xl"></i>
        </a>

      </div>

      <div class="mt-12 text-center">
        <p class="text-zinc-500 text-sm">Looking forward to hearing from you</p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-purple-500 text-purple-300 px-8 py-4 rounded-3xl flex items-center gap-3 z-50 shadow-xl">
    <i class="fa-solid fa-check"></i>
    <span id="toast-text" class="font-medium"></span>
  </div>

  <script>
    // Chrome Only
    function isChrome() {
      return /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
    }

    if (!isChrome()) {
      alert("💎 For the best experience, please open this page in Google Chrome.");
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').textContent = 'Email copied successfully!';
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        
        setTimeout(() => {
          toast.classList.add('hidden');
          toast.classList.remove('flex');
        }, 2600);
      });
    }
  </script>
</body>
</html>
