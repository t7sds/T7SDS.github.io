<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connect • T7SDS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
    }
    .title-font {
      font-family: 'Space Grotesk', sans-serif;
    }

    .hero-bg {
      background: radial-gradient(circle at center, #1e3a8a 0%, #0a0a0a 70%);
    }

    .contact-card {
      transition: all 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
      opacity: 0;
      transform: translateY(30px);
    }
    
    .contact-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .contact-card:hover {
      transform: translateY(-8px);
      background: rgba(255,255,255,0.07);
    }

    .icon-circle {
      transition: all 0.4s ease;
    }
    
    .contact-card:hover .icon-circle {
      transform: scale(1.12) rotate(10deg);
    }

    /* Minimal Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #18181b;
    }
    ::-webkit-scrollbar-thumb {
      background: #64748b;
      border-radius: 20px;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen hero-bg overflow-x-hidden">

  <!-- Background Grid -->
  <div class="fixed inset-0 bg-[linear-gradient(to_right,#27272a_1px,transparent_1px),linear-gradient(to_bottom,#27272a_1px,transparent_1px)] bg-[size:50px_50px] opacity-20 z-0"></div>

  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-6 py-20">

    <!-- Header -->
    <div class="text-center mb-16">
      <h1 class="title-font text-6xl font-semibold tracking-tighter mb-2">T7SDS</h1>
      <p class="text-blue-300 tracking-widest text-sm font-medium">VPN is mandatory to use the links.</p>
      <div class="w-16 h-px mx-auto mt-8 bg-gradient-to-r from-transparent via-blue-500 to-transparent"></div>
    </div>

    <!-- Contact Cards -->
    <div class="max-w-md w-full space-y-5" id="cards-container">

      <!-- Email -->
      <div onclick="copyToClipboard('it7sds@gmail.com')" 
           class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-blue-500 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
        <div class="icon-circle w-12 h-12 bg-blue-500/10 text-blue-400 flex items-center justify-center text-3xl rounded-2xl">
          <i class="fa-solid fa-envelope"></i>
        </div>
        <div class="flex-1">
          <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-blue-400">Email</p>
          <p class="text-lg font-medium">it7sds@gmail.com</p>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-blue-400 text-xl"></i>
      </div>

      <!-- Telegram -->
      <a href="https://t.me/imt7s" target="_blank"
         class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-sky-400 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
        <div class="icon-circle w-12 h-12 bg-sky-500/10 text-sky-400 flex items-center justify-center text-3xl rounded-2xl">
          <i class="fa-brands fa-telegram"></i>
        </div>
        <div class="flex-1">
          <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-sky-400">Telegram</p>
          <p class="text-lg font-medium">@imt7s</p>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-sky-400 text-xl"></i>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com/t7sds" target="_blank"
         class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-pink-500 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
        <div class="icon-circle w-12 h-12 bg-pink-500/10 text-pink-400 flex items-center justify-center text-3xl rounded-2xl">
          <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="flex-1">
          <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-pink-400">Instagram</p>
          <p class="text-lg font-medium">@t7sds</p>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-pink-400 text-xl"></i>
      </a>

      <!-- X -->
      <a href="https://x.com/t7sds" target="_blank"
         class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-white rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
        <div class="icon-circle w-12 h-12 bg-white/10 text-white flex items-center justify-center text-3xl rounded-2xl">
          <i class="fa-brands fa-x-twitter"></i>
        </div>
        <div class="flex-1">
          <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-white">X (Twitter)</p>
          <p class="text-lg font-medium">@T7SDS</p>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-white text-xl"></i>
      </a>

      <!-- GitHub -->
      <a href="https://github.com/amt-ir" target="_blank"
         class="contact-card bg-zinc-900/70 border border-zinc-700 hover:border-emerald-500 rounded-3xl p-6 flex items-center gap-5 cursor-pointer group">
        <div class="icon-circle w-12 h-12 bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-3xl rounded-2xl">
          <i class="fa-brands fa-github"></i>
        </div>
        <div class="flex-1">
          <p class="text-xs uppercase tracking-widest text-zinc-400 group-hover:text-emerald-400">GitHub</p>
          <p class="text-lg font-medium">@AMR-IR</p>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-zinc-400 group-hover:text-emerald-400 text-xl"></i>
      </a>

    </div>

    <div class="mt-20 text-center">
      <p class="text-zinc-500 text-sm">Looking forward to hearing from you</p>
      <p class="text-zinc-600 text-xs mt-6">Powered by CNI1 — SPONSORACB™ ®2026</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-blue-500 text-blue-300 px-8 py-4 rounded-3xl flex items-center gap-3 z-50 shadow-2xl">
    <i class="fa-solid fa-check"></i>
    <span id="toast-text" class="font-medium"></span>
  </div>

  <script>
    function isChrome() {
      return /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
    }

    if (!isChrome()) {
      alert("💎 For the best experience, please open this page in Google Chrome.");
    }

    function animateOnScroll() {
      const cards = document.querySelectorAll('.contact-card');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add('visible');
            }, index * 60);
          }
        });
      }, { threshold: 0.4 });

      cards.forEach(card => observer.observe(card));
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').textContent = 'Email copied successfully!';
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        
        setTimeout(() => {
          toast.classList.add('hidden');
          toast.classList.remove('flex');
        }, 2500);
      });
    }

    window.onload = () => {
      animateOnScroll();
    };
  </script>
</body>
</html>
